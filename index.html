<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Rasidul Hoque Chowdhury | AI/ML, Research & Software</title>
    <meta name="title" content="Rasidul Hoque Chowdhury | AI/ML, Research & Software" />
    <meta
      name="description"

      content="Rasidul Hoque Chowdhury, Machine Learning, Deep Learning, Explainable AI, SHAP, Computer Vision, Flutter, Leading University, AI Researcher, Software Engineer, Portfolio"
    />
    <link rel="canonical" href="https://rasidul-hoque-chowdhury.netlify.app/" />

    <!-- Anti-FOUC script for instant theme synchronization -->
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    </script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
